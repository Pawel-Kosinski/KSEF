services:
  postgres:
    image: postgres:16-alpine
    container_name: vcfo-postgres
    environment:
      POSTGRES_USER: vcfo
      POSTGRES_PASSWORD: vcfo_secret
      POSTGRES_DB: wirtualny_cfo
    ports:
      - "5432:5432"
    volumes:
      - vcfo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vcfo -d wirtualny_cfo"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Opcjonalnie: docker compose --profile ai up -d
  ollama:
    profiles: ["ai"]
    image: ollama/ollama:latest
    container_name: vcfo-ollama
    ports:
      - "11434:11434"
    volumes:
      - vcfo_ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  vcfo_pgdata:
  vcfo_ollama:
