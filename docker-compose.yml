services:
  postgres:
    image: postgres:16-alpine
    container_name: vcfo-postgres
    environment:
      POSTGRES_USER: vcfo
      POSTGRES_PASSWORD: vcfo_secret
      POSTGRES_DB: wirtualny_cfo
    ports:
      - "5432:5432"
    volumes:
      - vcfo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vcfo -d wirtualny_cfo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vcfo_pgdata:
